<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}pTrading System{% endblock %}</title>
  <!-- Tailwind CSS CDN for sleek, modern dashboard styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  <!-- Top Navigation Bar -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-sky-500/20">
          pT
        </div>
        <div>
          <span class="text-lg font-bold tracking-tight text-white">pTrading</span>
          <span class="text-xs px-2 py-0.5 ml-1.5 rounded bg-sky-500/10 text-sky-400 font-medium border border-sky-500/20">US Momentum Breakouts</span>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <!-- Market Status Badge -->
        <div id="market-status-badge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs">
          <span class="w-2 h-2 rounded-full {% if is_market_open %}bg-emerald-400 animate-pulse{% else %}bg-slate-500{% endif %}"></span>
          <span class="text-slate-300 font-medium">{% if is_market_open %}MARKET OPEN{% else %}MARKET CLOSED{% endif %}</span>
          <span class="text-slate-500">|</span>
          <span class="text-slate-400">{{ current_time_et }} ET</span>
        </div>

        <nav class="flex items-center gap-2 text-sm">
          <a href="/" class="px-3 py-1.5 rounded-md hover:bg-slate-700 text-slate-200 transition">Dashboard</a>
          <a href="/analytics" class="px-3 py-1.5 rounded-md hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition">Analytics</a>
          <a href="/health" target="_blank" class="px-3 py-1.5 rounded-md hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition">Health</a>
          <a href="/logout" class="px-3 py-1.5 rounded-md hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 transition">Logout</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-800 bg-slate-900/60 py-4 text-center text-xs text-slate-500">
    pTrading Engine &bull; Zero Overnight Gap Risk &bull; Alpaca Bracket Engine &bull; Dynamic ChartMill Basket
  </footer>
</body>
</html>
