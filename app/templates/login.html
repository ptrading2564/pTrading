<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — pTrading</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">
    <!-- Brand Header -->
    <div class="flex items-center gap-3.5 mb-7">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-sky-500/20">
        pT
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          pTrading
          <span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">Live</span>
        </h1>
        <p class="text-xs text-slate-400">US Momentum Breakouts &bull; Automated Engine</p>
      </div>
    </div>

    <!-- Alert / Error message -->
    {% if error %}
    <div class="mb-5 px-4 py-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs font-medium flex items-start gap-2.5">
      <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke_width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <!-- Primary Option: Sign in with Google -->
    <div class="space-y-3">
      {% if google_oauth_enabled %}
      <a
        href="/auth/google/login?next={{ next_url or '/' }}"
        class="w-full py-3 px-4 rounded-xl bg-white hover:bg-slate-100 text-slate-800 text-sm font-semibold transition flex items-center justify-center gap-3 shadow-lg hover:shadow-xl transform active:scale-[0.99] duration-150"
      >
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </a>
      {% else %}
      <a
        href="/auth/google/login?next={{ next_url or '/' }}"
        onclick="if(!confirm('Google OAuth is pending Client ID configuration in .env. Click OK to try, or use fallback password below.')) return false;"
        class="w-full py-3 px-4 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition flex items-center justify-center gap-3 border border-slate-600/60"
      >
        <svg class="w-5 h-5 shrink-0 opacity-80" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </a>
      {% endif %}
    </div>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-700/80"></div>
      </div>
      <div class="relative flex justify-center text-xs">
        <span class="px-3 bg-slate-800 text-slate-400 font-medium uppercase tracking-wider text-[11px]">or sign in with password</span>
      </div>
    </div>

    <!-- Fallback Username & Password Form -->
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next_url or '/' }}">

      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username or Email</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition"
          placeholder="Enter username or email"
        >
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
        </div>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition"
          placeholder="••••••••••••"
        >
      </div>

      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-sm font-semibold transition shadow-lg shadow-sky-500/20 active:scale-[0.99] duration-150"
      >
        Sign In with Password
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-700/50 flex items-center justify-between text-[11px] text-slate-500">
      <span>pTrading Engine v2.0</span>
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        Encrypted TLS 1.3
      </span>
    </div>
  </div>
</body>
</html>
