<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — pTrading</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  <div class="w-full max-w-sm bg-slate-800/90 border border-slate-700/60 rounded-2xl p-7 shadow-2xl">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white text-lg shadow-lg shadow-sky-500/20">
        pT
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white">pTrading</h1>
        <p class="text-xs text-slate-400">US Momentum Breakouts Dashboard</p>
      </div>
    </div>

    {% if error %}
    <div class="mb-4 px-3.5 py-2.5 rounded-lg bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs font-medium">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next_url or '/' }}">

      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autofocus
          autocomplete="username"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
          placeholder="admin"
        >
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
          placeholder="••••••••••••"
        >
      </div>

      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-sm font-semibold transition shadow-lg shadow-sky-500/20"
      >
        Sign In
      </button>
    </form>

    <p class="mt-6 text-center text-[11px] text-slate-500">
      pTrading Engine &bull; Secure Session Authentication
    </p>
  </div>
</body>
</html>
